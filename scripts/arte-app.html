<!doctype html>
<!-- Arte de la app: icono (capas del icono adaptable de Android, icono viejo, el de la tienda y el de la web)
     y pantalla de arranque, todo a partir del logo scripts/logo-tjrush.jpg (cuadrado, sin marco).
     Lo genera scripts/arte-app.mjs (abre esta pagina en Chromium, le pasa el logo y guarda los PNG).
     Tambien se puede abrir a mano en el navegador para ver como quedan. -->
<html lang="es"><head><meta charset="utf-8"><title>Arte TJ Rush</title>
<style>body { background: #444; color: #eee; font-family: sans-serif; } canvas { margin: 6px; vertical-align: top; }</style>
</head><body>
<script>
const FONDO = '#121212';
let LOGO = null;

// el logo en un cuadro de 108 x 108 unidades (a lo que se escale el lienzo)
function logo(x, x0 = 0, y0 = 0, s = 108) { x.drawImage(LOGO, x0, y0, s, s); }

// icono adaptable de Android: el lanzador recorta las capas con su forma (circulo, cuadro redondeado...)
// y solo se ve el centro (de 18 a 90 de 108). El titulo del logo va abajo, asi que al frente el logo
// va un poco mas arriba (se recorta cielo, no letras); al fondo, el tono del asfalto con el mismo logo
// borroso detras, para que la orilla de abajo se funda.
const FRENTE = 80, FRENTE_Y = 8;
function fondo(x) {
  x.fillStyle = '#1c1720'; x.fillRect(0, 0, 108, 108); // el tono del asfalto de abajo del logo
  x.filter = 'blur(2.5px) brightness(0.8)';
  logo(x, (108 - FRENTE) / 2, FRENTE_Y, FRENTE); // en el mismo lugar que el de enfrente: solo sus orillas se difuminan
  x.filter = 'none';
}
function frente(x) { logo(x, (108 - FRENTE) / 2, FRENTE_Y, FRENTE); }
// icono completo (Android viejito y la web): el logo recortado en cuadro redondeado o circulo
function completo(x, redondo) {
  x.save(); x.beginPath();
  if (redondo) x.arc(54, 54, 54, 0, 7); else x.roundRect(0, 0, 108, 108, 20);
  x.clip(); logo(x); x.restore();
}

// pantalla de arranque: fondo oscuro, el logo (que ya trae el titulo) y abajo de donde es
function arranque(x, w, h) {
  x.fillStyle = FONDO; x.fillRect(0, 0, w, h);
  const s = Math.min(w, h) * 0.46, cy = h * 0.45;
  x.save(); x.shadowColor = 'rgba(0,0,0,0.7)'; x.shadowBlur = s * 0.06; x.shadowOffsetY = s * 0.02;
  x.translate(w / 2 - s / 2, cy - s / 2); x.scale(s / 108, s / 108);
  x.fillStyle = FONDO; x.beginPath(); x.roundRect(0, 0, 108, 108, 20); x.fill(); x.restore();
  x.save(); x.translate(w / 2 - s / 2, cy - s / 2); x.scale(s / 108, s / 108); completo(x, false); x.restore();
  const f = Math.min(w, h) * 0.034;
  x.textAlign = 'center'; x.textBaseline = 'top';
  x.font = 'bold ' + f + 'px "DejaVu Sans", sans-serif'; x.fillStyle = '#f4efe6';
  x.fillText('Z O N A   C E N T R O  ·  T I J U A N A', w / 2, cy + s / 2 + f * 1.4);
}

// lienzo de tamano n con el dibujo en espacio de 108 unidades
function lienzo(n, fn) {
  const c = document.createElement('canvas'); c.width = c.height = n;
  const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.scale(n / 108, n / 108); fn(x); return c;
}
window.ARTE = {
  // el logo llega como data URL (desde file:// el lienzo no dejaria exportar una imagen cargada de disco)
  cargar: (src) => new Promise((ok, mal) => { const i = new Image(); i.onload = () => { LOGO = i; ok(); }; i.onerror = mal; i.src = src; }),
  fondo: (n) => lienzo(n, fondo).toDataURL(),
  frente: (n) => lienzo(n, frente).toDataURL(),
  icono: (n, redondo) => lienzo(n, (x) => completo(x, redondo)).toDataURL(),
  // icono para la ficha de Google Play: cuadrado completo (la tienda le redondea las esquinas)
  tienda: (n) => lienzo(n, (x) => logo(x)).toDataURL(),
  arranque: (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; arranque(c.getContext('2d'), w, h); return c.toDataURL(); },
  // vista previa: capas, iconos completos y el arranque
  muestra: () => {
    for (const c of [lienzo(216, fondo), lienzo(216, frente), lienzo(216, (x) => completo(x, false)), lienzo(216, (x) => completo(x, true))]) document.body.appendChild(c);
    const a = document.createElement('canvas'); a.width = 800; a.height = 480; arranque(a.getContext('2d'), 800, 480); document.body.appendChild(a);
  },
};
// abierta a mano: carga el logo de junto (en Chromium desde file:// se ve, aunque no se pueda exportar)
if (!navigator.webdriver) ARTE.cargar('logo-tjrush.jpg').then(ARTE.muestra);
</script>
</body></html>
